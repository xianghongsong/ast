<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>七夕快乐 · 心动粒子</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 22%, rgba(115, 36, 105, .22), transparent 36%),
        radial-gradient(circle at 20% 78%, rgba(255, 95, 168, .10), transparent 32%),
        #030105;
      color: #fff;
      font-family: "STKaiti", "KaiTi", "Microsoft YaHei", serif;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .stars,
    .stars::before,
    .stars::after {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
      background-repeat: repeat;
      opacity: .75;
    }

    .stars {
      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 1.6px),
        radial-gradient(circle, rgba(255,191,229,.75) 0 1px, transparent 1.8px);
      background-size: 110px 110px, 170px 170px;
      background-position: 12px 30px, 60px 80px;
      animation: drift 16s linear infinite;
    }

    .stars::before {
      background-image: radial-gradient(circle, rgba(255,226,161,.85) 0 1px, transparent 2px);
      background-size: 230px 230px;
      background-position: 90px 10px;
      animation: twinkle 3.2s ease-in-out infinite alternate;
    }

    .stars::after {
      background-image: radial-gradient(circle, rgba(230,192,255,.7) 0 1.2px, transparent 2.1px);
      background-size: 300px 300px;
      background-position: 40px 140px;
      animation: twinkle 4.2s 1s ease-in-out infinite alternate-reverse;
    }

    .card {
      position: relative;
      width: min(94vw, 900px);
      height: min(94vh, 790px);
      min-height: 620px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      z-index: 2;
    }

    .title-wrap {
      position: relative;
      height: 118px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: -3px;
      user-select: none;
    }

    .title {
      position: relative;
      font-weight: 700;
      font-size: clamp(44px, 7vw, 74px);
      line-height: 1;
      letter-spacing: .18em;
      padding-left: .18em;
      background: linear-gradient(180deg, #fff8fc 0%, #ffd3ea 24%, #ff92c8 55%, #eec4ff 78%, #ffe8a9 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 8px rgba(255, 144, 205, .88))
              drop-shadow(0 0 20px rgba(231, 117, 255, .42));
      animation: breatheTitle 2.8s ease-in-out infinite;
    }

    .title::before,
    .title::after {
      position: absolute;
      top: 50%;
      transform: translateY(-52%);
      color: #ffd2ee;
      text-shadow: 0 0 10px rgba(255, 151, 215, .9);
      font-size: .4em;
      background: none;
      -webkit-text-fill-color: #ffd2ee;
    }

    .title::before { content: "✦"; left: -1.25em; animation: sparkle 1.8s ease-in-out infinite; }
    .title::after  { content: "✦"; right: -1.05em; animation: sparkle 1.8s .7s ease-in-out infinite; }

    .subtitle {
      position: absolute;
      bottom: 7px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      letter-spacing: .46em;
      padding-left: .46em;
      color: rgba(255, 220, 239, .78);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 130, 198, .4);
    }

    .ornament {
      position: absolute;
      left: 50%;
      bottom: -3px;
      width: min(430px, 72vw);
      height: 1px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, rgba(255,178,218,.18), rgba(255,223,169,.85), rgba(255,178,218,.18), transparent);
      box-shadow: 0 0 12px rgba(255,176,220,.5);
    }

    .canvas-shell {
      position: relative;
      width: min(90vw, 840px);
      aspect-ratio: 840 / 680;
      max-height: calc(94vh - 118px);
      overflow: visible;
      filter: drop-shadow(0 0 28px rgba(233, 114, 200, .10));
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
    }

    .corner-note {
      position: absolute;
      right: 12px;
      bottom: 8px;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 11px;
      letter-spacing: .14em;
      color: rgba(255,255,255,.25);
      user-select: none;
    }

    @keyframes drift {
      from { transform: translate3d(0,0,0); }
      to   { transform: translate3d(-55px,30px,0); }
    }
    @keyframes twinkle {
      from { opacity: .3; filter: brightness(.8); }
      to   { opacity: .9; filter: brightness(1.45); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: .35; transform: translateY(-52%) scale(.7) rotate(0deg); }
      50%      { opacity: 1; transform: translateY(-52%) scale(1.15) rotate(35deg); }
    }
    @keyframes breatheTitle {
      0%,100% { transform: scale(1); }
      50%     { transform: scale(1.025); }
    }

    @media (max-height: 680px) {
      .title-wrap { height: 88px; }
      .title { font-size: clamp(38px, 7vw, 58px); }
      .subtitle { bottom: 1px; }
      .canvas-shell { max-height: calc(96vh - 88px); width: min(82vw, 760px); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="stars"></div>

    <section class="card">
      <div class="title-wrap">
        <div class="title">七夕快乐</div>
        <div class="subtitle">Happy Chinese Valentine's Day</div>
        <div class="ornament"></div>
      </div>

      <div class="canvas-shell">
        <canvas id="heartCanvas" width="840" height="680"></canvas>
        <div class="corner-note">愿每一次心动，都有回应</div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const W = 840;
      const H = 680;
      const CX = W / 2;
      const CY = H / 2;
      const IMAGE_ENLARGE = 11;
      const HEART_COLOR = '#EEAEEE';
      const FRAME_COUNT = 20;

      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d', { alpha: true });

      function resizeForDPR() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resizeForDPR();
      window.addEventListener('resize', resizeForDPR);

      const rand = (min, max) => Math.random() * (max - min) + min;
      const randInt = (min, max) => Math.floor(rand(min, max + 1));

      function heartFunction(t) {
        let x = 17 * Math.pow(Math.sin(t), 3);
        let y = -(16 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(3 * t));
        x = x * IMAGE_ENLARGE + CX;
        y = y * IMAGE_ENLARGE + CY;
        return [x, y];
      }

      function scatterInside(x, y, beta = 0.15) {
        const rx = -beta * Math.log(Math.max(Math.random(), 1e-9));
        const ry = -beta * Math.log(Math.max(Math.random(), 1e-9));
        const dx = rx * (x - CX);
        const dy = ry * (y - CY);
        return [x - dx, y - dy];
      }

      function shrink(x, y, ratio) {
        const dist2 = (x - CX) ** 2 + (y - CY) ** 2;
        const force = -1 / Math.pow(Math.max(dist2, 1e-6), 0.6);
        const dx = ratio * force * (x - CX);
        const dy = ratio * force * (y - CY);
        return [x - dx, y - dy];
      }

      function curve(p) {
        return 2 * (2 * Math.sin(4 * p)) / (2 * Math.PI);
      }

      function calcPosition(x, y, ratio) {
        const dist2 = (x - CX) ** 2 + (y - CY) ** 2;
        const force = 1 / Math.pow(Math.max(dist2, 1e-6), 0.420);
        const dx = ratio * force * (x - CX) + randInt(-1, 1);
        const dy = ratio * force * (y - CY) + randInt(-1, 1);
        return [x - dx, y - dy];
      }

      const basePoints = [];
      const edgePoints = [];
      const centerPoints = [];

      for (let i = 0; i < 2000; i++) {
        const t = rand(0, 2 * Math.PI);
        basePoints.push(heartFunction(t));
      }

      for (const [x, y] of basePoints) {
        for (let i = 0; i < 3; i++) {
          edgePoints.push(scatterInside(x, y, 0.05));
        }
      }

      for (let i = 0; i < 10000; i++) {
        const [x, y] = basePoints[randInt(0, basePoints.length - 1)];
        centerPoints.push(scatterInside(x, y, 0.27));
      }

      function drawParticle(x, y, size, alpha = 1) {
        ctx.globalAlpha = alpha;
        ctx.fillRect(x, y, size, size);
      }

      function drawHalo(frame, haloRadius, haloNumber) {
        const count = Math.min(haloNumber, 4600);
        ctx.save();
        ctx.shadowBlur = 5;
        ctx.shadowColor = 'rgba(238,174,238,.5)';
        for (let i = 0; i < count; i++) {
          const t = rand(0, 2 * Math.PI);
          let [x, y] = heartFunction(t);
          [x, y] = shrink(x, y, haloRadius);
          x += randInt(-60, 60);
          y += randInt(-60, 60);
          const s = Math.random() < 0.68 ? 1 : 2;
          const a = rand(0.16, 0.68);

          drawParticle(x, y, s, a);
          if (i % 2 === 0) drawParticle(x + 20, y + 20, s, a * .72);
          if (i % 3 === 0) drawParticle(x - 20, y - 20, s, a * .72);
          if (i % 4 === 0) drawParticle(x + 20, y - 20, s, a * .55);
          if (i % 5 === 0) drawParticle(x - 20, y + 20, s, a * .55);
        }
        ctx.restore();
      }

      function render(frame) {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = HEART_COLOR;

        const p = (frame / 10) * Math.PI;
        const c = curve(p);
        const ratio = 15 * c;
        const haloRadius = Math.round(4 + 6 * (1 + c));
        const haloNumber = Math.round(3000 + 4000 * Math.abs(c * c));

        drawHalo(frame, haloRadius, haloNumber);

        ctx.save();
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'rgba(238,174,238,.75)';
        ctx.globalAlpha = .98;
        for (const [bx, by] of basePoints) {
          const [x, y] = calcPosition(bx, by, ratio);
          const size = randInt(1, 3);
          ctx.fillRect(x, y, size, size);
        }
        ctx.restore();

        ctx.globalAlpha = .80;
        for (const [bx, by] of edgePoints) {
          const [x, y] = calcPosition(bx, by, ratio);
          const size = randInt(1, 2);
          ctx.fillRect(x, y, size, size);
        }

        ctx.globalAlpha = .68;
        for (const [bx, by] of centerPoints) {
          const [x, y] = calcPosition(bx, by, ratio);
          const size = randInt(1, 2);
          ctx.fillRect(x, y, size, size);
        }

        const glow = ctx.createRadialGradient(CX, CY + 30, 10, CX, CY + 30, 245);
        glow.addColorStop(0, 'rgba(255,150,214,.045)');
        glow.addColorStop(1, 'rgba(255,150,214,0)');
        ctx.globalAlpha = 1;
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, H);
      }

      let frame = 0;
      let tick = 0;
      function animate() {
        if ((tick++ & 1) === 0) {
          render(frame);
          frame = (frame + 1) % FRAME_COUNT;
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
